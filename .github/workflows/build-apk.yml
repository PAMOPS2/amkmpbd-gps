
name: Build AMKMPBD GPS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          unzip -q AMKMPBD_GPS_ANDROID_CLOUD_BUILD.zip -d source

      - name: Build debug APK
        working-directory: source/AMKMPBD_GPS_ANDROID
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMKMPBD-GPS-APK
          path: source/AMKMPBD_GPS_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
